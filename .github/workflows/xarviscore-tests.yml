name: XarvisCore tests
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run runtime and supervisor tests
        run: |
          python -m pytest -q \
            tests/test_xarvis_demo.py \
            tests/test_xarvis_doctor.py \
            tests/test_xarvis_run_show.py \
            tests/test_xarvis_runs.py \
            tests/test_xarvis_runs_export.py \
            tests/test_xarvis_runs_stats.py \
            tests/test_xarvis_supervisor.py \
            tests/test_xarvis_v02_hardening.py
