[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "escriba"
version = "0.1.0"
description = "Plataforma local de speech-to-text con reconocimiento multi-idioma y clasificación inteligente"
readme = "README.md"
requires-python = ">=3.9.6"
authors = [
    {name = "ESCRIBA Team"}
]
keywords = ["speech-to-text", "transcription", "multi-language", "classification", "AI"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core transcription
    "faster-whisper>=1.0.0",
    
    # Audio processing
    "sounddevice>=0.4.6",
    "ffmpeg-python>=0.2.0",
    "numpy>=1.24.0",
    
    # Language detection
    "langdetect>=1.0.9",
    "langid>=1.1.6",
    
    # Text processing and classification
    "spacy>=3.7.0",
    "nltk>=3.8.1",
    
    # Storage
    "sqlalchemy>=2.0.0",
    
    # UI
    "rich>=13.7.0",
    "textual>=0.47.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    
    # Utilities
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.12.0",
    "ruff>=0.1.9",
    "mypy>=1.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
