[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xarviscore"
version = "0.1.0"
description = "XarvisCore demo kernel and CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "flask>=3.0.0",
  "flask-cors>=4.0.0",
  "python-dotenv>=1.0.0",
  "psutil>=5.9.0",
  "requests>=2.31.0",
  "pyOpenSSL>=23.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
  "black>=23.0.0",
]

[project.scripts]
xarvis = "xarvis.cli.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["xarvis*"]

