[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mamba-dl"
version = "0.1.0"
description = "Download videos at max quality with yt-dlp, live speed, and per-item metrics JSON logs."
requires-python = ">=3.9"
dependencies = [
  "yt-dlp>=2024.3.10",
  "typer>=0.12.0",
]

[project.scripts]
mamba-dl = "mamba_dl.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["mamba_dl*"]
