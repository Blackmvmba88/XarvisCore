<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🦅 BlackMamba LocalTube - Reproductor Sin Lag</title>
    <style>
        :root {
            --primary: #00ff41;
            --secondary: #0a84ff;
            --bg: #0a0a0a;
            --glass: rgba(20, 20, 20, 0.9);
            --border: rgba(0, 255, 65, 0.3);
            --text: #e0e0e0;
            --hover: rgba(0, 255, 65, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            color: var(--text);
            overflow: hidden;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 350px;
            height: 100vh;
            gap: 0;
        }

        /* === SECCIÓN PRINCIPAL === */
        .main-section {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Header */
        .header {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-icon {
            font-size: 2em;
        }

        .logo-text {
            font-size: 1.5em;
            font-weight: bold;
            color: var(--primary);
            text-shadow: 0 0 15px var(--primary);
        }

        .search-container {
            flex: 1;
            max-width: 600px;
            margin: 0 30px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 12px 50px 12px 20px;
            background: rgba(0, 255, 65, 0.05);
            border: 1px solid var(--border);
            border-radius: 25px;
            color: var(--text);
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
        }

        .search-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.2em;
            color: var(--primary);
        }

        .stats {
            display: flex;
            gap: 20px;
            font-size: 0.9em;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 15px;
            background: rgba(0, 255, 65, 0.1);
            border-radius: 20px;
            border: 1px solid var(--border);
        }

        /* Video Player */
        .video-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow: hidden;
        }

        .video-container {
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.5);
            border: 2px solid var(--border);
            margin-bottom: 20px;
            position: relative;
        }

        video {
            width: 100%;
            height: 60vh;
            display: block;
        }

        .video-info {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
        }

        .video-title {
            font-size: 1.5em;
            color: var(--primary);
            margin-bottom: 10px;
            font-weight: bold;
        }

        .video-meta {
            display: flex;
            gap: 20px;
            font-size: 0.9em;
            opacity: 0.7;
            margin-bottom: 15px;
        }

        .video-controls-custom {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .control-btn {
            padding: 10px 20px;
            background: rgba(0, 255, 65, 0.1);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9em;
        }

        .control-btn:hover {
            background: rgba(0, 255, 65, 0.2);
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .control-btn.active {
            background: var(--primary);
            color: #000;
            font-weight: bold;
        }

        /* === SIDEBAR === */
        .sidebar {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-title {
            font-size: 1.3em;
            color: var(--primary);
            font-weight: bold;
            margin-bottom: 15px;
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 6px 12px;
            background: rgba(0, 255, 65, 0.05);
            border: 1px solid var(--border);
            border-radius: 15px;
            color: var(--text);
            cursor: pointer;
            font-size: 0.85em;
            transition: all 0.3s ease;
        }

        .filter-btn:hover {
            background: rgba(0, 255, 65, 0.15);
        }

        .filter-btn.active {
            background: var(--primary);
            color: #000;
            font-weight: bold;
        }

        .playlist {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .video-item {
            display: flex;
            gap: 12px;
            padding: 12px;
            background: rgba(0, 255, 65, 0.03);
            border: 1px solid rgba(0, 255, 65, 0.1);
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .video-item:hover {
            background: rgba(0, 255, 65, 0.1);
            border-color: var(--primary);
            transform: translateX(5px);
        }

        .video-item.playing {
            background: rgba(0, 255, 65, 0.15);
            border-color: var(--primary);
            border-width: 2px;
        }

        .video-thumbnail {
            width: 120px;
            height: 68px;
            background: linear-gradient(135deg, rgba(0, 255, 65, 0.2), rgba(10, 132, 255, 0.2));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            flex-shrink: 0;
        }

        .video-item-info {
            flex: 1;
            min-width: 0;
        }

        .video-item-title {
            font-size: 0.95em;
            color: var(--text);
            margin-bottom: 5px;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .video-item-meta {
            font-size: 0.8em;
            opacity: 0.6;
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            opacity: 0.6;
        }

        .empty-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        /* Scrollbar personalizado */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 255, 65, 0.05);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 4px;
        }

        .loading {
            text-align: center;
            padding: 30px;
            font-size: 1.2em;
            color: var(--primary);
        }

        .spinner {
            border: 3px solid rgba(0, 255, 65, 0.1);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .no-video-selected {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 60vh;
            background: var(--glass);
            border-radius: 15px;
            border: 2px dashed var(--border);
        }

        .no-video-icon {
            font-size: 5em;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .no-video-text {
            font-size: 1.5em;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- SECCIÓN PRINCIPAL -->
        <div class="main-section">
            <!-- Header -->
            <div class="header">
                <div class="logo">
                    <span class="logo-icon">🦅</span>
                    <span class="logo-text">LocalTube</span>
                </div>
                <div class="search-container">
                    <input 
                        type="text" 
                        class="search-input" 
                        id="searchInput"
                        placeholder="Buscar en tu biblioteca local..."
                    >
                    <span class="search-icon">🔍</span>
                </div>
                <div class="stats">
                    <div class="stat-item">
                        <span>📹</span>
                        <span id="totalVideos">0</span>
                    </div>
                    <div class="stat-item">
                        <span>▶️</span>
                        <span id="playingNow">Ninguno</span>
                    </div>
                </div>
            </div>

            <!-- Video Player -->
            <div class="video-section">
                <div id="videoPlayerContainer">
                    <div class="no-video-selected">
                        <div class="no-video-icon">🎬</div>
                        <div class="no-video-text">Selecciona un video de la playlist</div>
                    </div>
                </div>

                <div class="video-info" id="videoInfo" style="display: none;">
                    <div class="video-title" id="currentVideoTitle">Sin título</div>
                    <div class="video-meta">
                        <span id="videoSize">0 MB</span>
                        <span>•</span>
                        <span id="videoPath">Sin ruta</span>
                    </div>
                    <div class="video-controls-custom">
                        <button class="control-btn" onclick="changeSpeed(0.5)">0.5x</button>
                        <button class="control-btn active" onclick="changeSpeed(1)">1x</button>
                        <button class="control-btn" onclick="changeSpeed(1.5)">1.5x</button>
                        <button class="control-btn" onclick="changeSpeed(2)">2x</button>
                        <button class="control-btn" onclick="toggleLoop()">🔁 Loop</button>
                        <button class="control-btn" onclick="playNext()">⏭️ Siguiente</button>
                        <button class="control-btn" onclick="playPrevious()">⏮️ Anterior</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">📚 Mi Biblioteca</div>
                <div class="filter-buttons">
                    <button class="filter-btn active" onclick="filterVideos('all')">Todos</button>
                    <button class="filter-btn" onclick="filterVideos('mp4')">MP4</button>
                    <button class="filter-btn" onclick="filterVideos('mkv')">MKV</button>
                    <button class="filter-btn" onclick="filterVideos('recent')">Recientes</button>
                </div>
            </div>
            <div class="playlist" id="playlist">
                <div class="loading">
                    <div class="spinner"></div>
                    Cargando biblioteca...
                </div>
            </div>
        </div>
    </div>

    <script>
        let allVideos = [];
        let filteredVideos = [];
        let currentVideoIndex = -1;
        let currentFilter = 'all';
        let videoElement = null;

        // Cargar lista de videos
        async function loadVideoLibrary() {
            const playlist = document.getElementById('playlist');
            
            try {
                const response = await fetch('http://localhost:8888/api/videos');
                const data = await response.json();
                
                allVideos = data.videos.map(v => ({
                    ...v,
                    path: `http://localhost:8888/api/video/${v.relative_path}`
                }));
                
                filteredVideos = [...allVideos];
                
                document.getElementById('totalVideos').textContent = allVideos.length;
                
                renderPlaylist();

            } catch (error) {
                console.error('Error cargando biblioteca:', error);
                playlist.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">⚠️</div>
                        <h3 style="color: var(--primary); margin-bottom: 15px;">
                            Servidor no conectado
                        </h3>
                        <p style="margin-bottom: 20px;">
                            Inicia el servidor LocalTube primero
                        </p>
                        <p style="font-size: 0.9em; opacity: 0.7;">
                            En terminal ejecuta:<br><br>
                            <code style="background: rgba(0,255,65,0.1); padding: 10px; display: inline-block; border-radius: 5px;">
                            python3 local_youtube_server.py
                            </code>
                        </p>
                        <br>
                        <button class="control-btn" onclick="loadVideoLibrary()" style="margin-top: 20px;">
                            🔄 Reintentar Conexión
                        </button>
                    </div>
                `;
            }
        }

        // Función para escanear USB
        async function scanUSB() {
            const playlist = document.getElementById('playlist');
            playlist.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    Escaneando USB... Esto puede tomar unos segundos
                </div>
            `;
            
            try {
                const response = await fetch('http://localhost:8888/api/scan');
                const data = await response.json();
                
                alert(`✅ Escaneo completo!\n\n${data.message}\n\nRecarga la página para ver los videos.`);
                loadVideoLibrary();
            } catch (error) {
                alert('❌ Error: Servidor no conectado.\n\nInicia el servidor primero con:\npython3 local_youtube_server.py');
                loadVideoLibrary();
            }
        }

        // Reproducir video
        function playVideo(videoData, index) {
            currentVideoIndex = index;
            
            const container = document.getElementById('videoPlayerContainer');
            const info = document.getElementById('videoInfo');
            
            // Crear elemento de video
            container.innerHTML = `
                <div class="video-container">
                    <video controls autoplay id="mainVideo">
                        <source src="${videoData.path}" type="video/mp4">
                        Tu navegador no soporta video HTML5.
                    </video>
                </div>
            `;
            
            videoElement = document.getElementById('mainVideo');
            
            // Actualizar info
            document.getElementById('currentVideoTitle').textContent = videoData.title;
            document.getElementById('videoSize').textContent = videoData.size;
            document.getElementById('videoPath').textContent = videoData.folder;
            document.getElementById('playingNow').textContent = 'Reproduciendo';
            info.style.display = 'block';
            
            // Auto siguiente
            videoElement.onended = () => {
                playNext();
            };
            
            // Actualizar UI
            updatePlaylistUI();
        }

        // Cambiar velocidad
        function changeSpeed(speed) {
            if (videoElement) {
                videoElement.playbackRate = speed;
                
                // Actualizar botones
                document.querySelectorAll('.video-controls-custom .control-btn').forEach(btn => {
                    btn.classList.remove('active');
                    if (btn.textContent.includes(speed + 'x')) {
                        btn.classList.add('active');
                    }
                });
            }
        }

        // Toggle loop
        function toggleLoop() {
            if (videoElement) {
                videoElement.loop = !videoElement.loop;
                const btn = event.target;
                btn.classList.toggle('active');
            }
        }

        // Siguiente video
        function playNext() {
            if (currentVideoIndex < filteredVideos.length - 1) {
                playVideo(filteredVideos[currentVideoIndex + 1], currentVideoIndex + 1);
            }
        }

        // Video anterior
        function playPrevious() {
            if (currentVideoIndex > 0) {
                playVideo(filteredVideos[currentVideoIndex - 1], currentVideoIndex - 1);
            }
        }

        // Filtrar videos
        function filterVideos(filter) {
            currentFilter = filter;
            
            // Actualizar botones
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // Aplicar filtro
            if (filter === 'all') {
                filteredVideos = [...allVideos];
            } else if (filter === 'mp4') {
                filteredVideos = allVideos.filter(v => v.path.endsWith('.mp4'));
            } else if (filter === 'mkv') {
                filteredVideos = allVideos.filter(v => v.path.endsWith('.mkv'));
            } else if (filter === 'recent') {
                filteredVideos = [...allVideos].sort((a, b) => b.date - a.date);
            }
            
            renderPlaylist();
        }

        // Buscar
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            
            if (query === '') {
                filteredVideos = [...allVideos];
            } else {
                filteredVideos = allVideos.filter(v => 
                    v.title.toLowerCase().includes(query) ||
                    v.folder.toLowerCase().includes(query)
                );
            }
            
            renderPlaylist();
        });

        // Renderizar playlist
        function renderPlaylist() {
            const playlist = document.getElementById('playlist');
            
            if (filteredVideos.length === 0) {
                playlist.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🔍</div>
                        <p>No se encontraron videos</p>
                    </div>
                `;
                return;
            }
            
            playlist.innerHTML = filteredVideos.map((video, index) => `
                <div class="video-item ${index === currentVideoIndex ? 'playing' : ''}" 
                     onclick="playVideo(${JSON.stringify(video).replace(/"/g, '&quot;')}, ${index})">
                    <div class="video-thumbnail">
                        ${video.icon}
                    </div>
                    <div class="video-item-info">
                        <div class="video-item-title">${video.title}</div>
                        <div class="video-item-meta">${video.size} • ${video.format}</div>
                    </div>
                </div>
            `).join('');
        }

        function updatePlaylistUI() {
            const items = document.querySelectorAll('.video-item');
            items.forEach((item, index) => {
                if (index === currentVideoIndex) {
                    item.classList.add('playing');
                    item.scrollIntoView({ behavior: 'smooth', block: 'center' });
                } else {
                    item.classList.remove('playing');
                }
            });
        }

        // Soporte de arrastrar y soltar
        document.body.addEventListener('dragover', (e) => {
            e.preventDefault();
        });

        document.body.addEventListener('drop', (e) => {
            e.preventDefault();
            const files = [...e.dataTransfer.files].filter(f => 
                f.type.includes('video')
            );
            
            if (files.length > 0) {
                files.forEach((file, index) => {
                    const video = {
                        title: file.name,
                        path: URL.createObjectURL(file),
                        size: (file.size / 1024 / 1024).toFixed(2) + ' MB',
                        format: file.name.split('.').pop().toUpperCase(),
                        folder: 'Arrastrado',
                        icon: '🎬',
                        date: new Date()
                    };
                    allVideos.push(video);
                });
                
                filteredVideos = [...allVideos];
                renderPlaylist();
                document.getElementById('totalVideos').textContent = allVideos.length;
            }
        });

        // Cargar al inicio
        loadVideoLibrary();
    </script>
</body>
</html>
