<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎼 BLACKMAMBA MUSIC PLAYER</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d1b4e 50%, #1a1a1a 100%);
            color: #ffffff;
            min-height: 100vh;
            padding: 20px;
        }

        .player-container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .header {
            background: linear-gradient(90deg, #8B5CF6 0%, #10B981 100%);
            padding: 20px 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 1.1rem;
            margin-top: 5px;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 20px;
            padding: 20px 30px;
        }

        .library-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .player-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 20px;
            height: fit-content;
        }

        .search-bar {
            width: 100%;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            color: white;
            font-size: 16px;
            margin-bottom: 20px;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-bar:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: #8B5CF6;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.3);
        }

        .search-bar::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .filter-btn:hover, .filter-btn.active {
            background: #8B5CF6;
            border-color: #8B5CF6;
            transform: translateY(-2px);
        }

        .music-list {
            max-height: 600px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #8B5CF6 rgba(255, 255, 255, 0.1);
        }

        .music-list::-webkit-scrollbar {
            width: 8px;
        }

        .music-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .music-list::-webkit-scrollbar-thumb {
            background: #8B5CF6;
            border-radius: 10px;
        }

        .track-item {
            display: flex;
            align-items: center;
            padding: 15px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .track-item:hover {
            background: rgba(139, 92, 246, 0.2);
            border-color: rgba(139, 92, 246, 0.5);
            transform: translateX(5px);
        }

        .track-item.playing {
            background: linear-gradient(90deg, rgba(139, 92, 246, 0.3), rgba(16, 185, 129, 0.3));
            border-color: #8B5CF6;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        .track-info {
            flex: 1;
        }

        .track-title {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 5px;
            color: #ffffff;
        }

        .track-details {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
        }

        .track-duration {
            color: #10B981;
            font-weight: 500;
            font-size: 14px;
        }

        .now-playing {
            text-align: center;
            margin-bottom: 20px;
        }

        .album-art {
            width: 200px;
            height: 200px;
            background: linear-gradient(45deg, #8B5CF6, #10B981);
            border-radius: 15px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.3);
        }

        .track-info-player {
            margin-bottom: 20px;
        }

        .track-title-player {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 5px;
            text-align: center;
        }

        .track-artist-player {
            color: rgba(255, 255, 255, 0.8);
            text-align: center;
        }

        .progress-container {
            margin: 20px 0;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            cursor: pointer;
            margin: 10px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #8B5CF6, #10B981);
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s ease;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin: 20px 0;
        }

        .control-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all 0.3s ease;
        }

        .control-btn:hover {
            background: #8B5CF6;
            transform: scale(1.1);
        }

        .play-pause-btn {
            width: 60px;
            height: 60px;
            font-size: 24px;
            background: linear-gradient(45deg, #8B5CF6, #10B981);
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }

        .volume-slider {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            outline: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: #8B5CF6;
            border-radius: 50%;
            cursor: pointer;
        }

        .stats {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            text-align: center;
        }

        .stats h3 {
            margin-bottom: 10px;
            color: #10B981;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: rgba(255, 255, 255, 0.6);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top: 4px solid #8B5CF6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            color: #EF4444;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .player-section {
                order: -1;
                position: static;
            }

            .header h1 {
                font-size: 2rem;
            }

            .album-art {
                width: 150px;
                height: 150px;
            }
        }
    </style>
</head>
<body>
    <div class="player-container">
        <header class="header">
            <h1>🎼 BLACKMAMBA MUSIC PLAYER</h1>
            <p>Biblioteca Musical Profesional | 11,000+ Tracks Suno AI</p>
        </header>

        <div class="main-content">
            <div class="library-section">
                <input type="text" class="search-bar" placeholder="🔍 Buscar por título, artista o género..." id="searchInput">
                
                <div class="filters">
                    <button class="filter-btn active" data-filter="all">🎵 Todos</button>
                    <button class="filter-btn" data-filter="mp3">📀 MP3</button>
                    <button class="filter-btn" data-filter="wav">💎 WAV</button>
                    <button class="filter-btn" data-filter="remix">🔄 Remix</button>
                    <button class="filter-btn" data-filter="cover">🎤 Cover</button>
                    <button class="filter-btn" data-filter="original">✨ Original</button>
                </div>

                <div id="musicList" class="music-list">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Cargando biblioteca musical...</p>
                    </div>
                </div>
            </div>

            <div class="player-section">
                <div class="now-playing">
                    <div class="album-art" id="albumArt">🎵</div>
                    <div class="track-info-player">
                        <div class="track-title-player" id="currentTitle">Selecciona una canción</div>
                        <div class="track-artist-player" id="currentArtist">BlackMamba Records</div>
                    </div>
                </div>

                <div class="progress-container">
                    <div class="progress-bar" id="progressBar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="time-display">
                        <span id="currentTime">0:00</span>
                        <span id="totalTime">0:00</span>
                    </div>
                </div>

                <div class="controls">
                    <button class="control-btn" id="prevBtn">⏮</button>
                    <button class="control-btn play-pause-btn" id="playPauseBtn">▶️</button>
                    <button class="control-btn" id="nextBtn">⏭</button>
                    <button class="control-btn" id="shuffleBtn">🔀</button>
                    <button class="control-btn" id="repeatBtn">🔁</button>
                </div>

                <div class="volume-container">
                    <span>🔊</span>
                    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="50">
                    <span id="volumeValue">50%</span>
                </div>

                <div class="stats">
                    <h3>📊 Estadísticas</h3>
                    <p>Canciones: <span id="trackCount">0</span></p>
                    <p>Tiempo total: <span id="totalDuration">0:00</span></p>
                    <p>Reproduciendo: <span id="playingCount">0</span></p>
                </div>
            </div>
        </div>
    </div>

    <audio id="audioPlayer" preload="metadata"></audio>

    <script>
        class BlackMambaMusicPlayer {
            constructor() {
                this.tracks = [];
                this.filteredTracks = [];
                this.currentTrack = null;
                this.currentIndex = 0;
                this.isPlaying = false;
                this.isShuffleMode = false;
                this.repeatMode = 'none'; // 'none', 'one', 'all'
                
                this.audioPlayer = document.getElementById('audioPlayer');
                this.playPauseBtn = document.getElementById('playPauseBtn');
                this.progressBar = document.getElementById('progressBar');
                this.progressFill = document.getElementById('progressFill');
                this.currentTime = document.getElementById('currentTime');
                this.totalTime = document.getElementById('totalTime');
                this.volumeSlider = document.getElementById('volumeSlider');
                this.volumeValue = document.getElementById('volumeValue');
                this.searchInput = document.getElementById('searchInput');
                this.musicList = document.getElementById('musicList');
                this.currentTitle = document.getElementById('currentTitle');
                this.currentArtist = document.getElementById('currentArtist');
                this.albumArt = document.getElementById('albumArt');
                
                this.initializeEventListeners();
                this.loadMusicLibrary();
            }

            initializeEventListeners() {
                // Controles del reproductor
                this.playPauseBtn.addEventListener('click', () => this.togglePlayPause());
                document.getElementById('prevBtn').addEventListener('click', () => this.previousTrack());
                document.getElementById('nextBtn').addEventListener('click', () => this.nextTrack());
                document.getElementById('shuffleBtn').addEventListener('click', () => this.toggleShuffle());
                document.getElementById('repeatBtn').addEventListener('click', () => this.toggleRepeat());

                // Barra de progreso
                this.progressBar.addEventListener('click', (e) => this.seekTo(e));
                this.audioPlayer.addEventListener('timeupdate', () => this.updateProgress());
                this.audioPlayer.addEventListener('loadedmetadata', () => this.updateDuration());
                this.audioPlayer.addEventListener('ended', () => this.trackEnded());

                // Control de volumen
                this.volumeSlider.addEventListener('input', (e) => this.changeVolume(e.target.value));

                // Búsqueda
                this.searchInput.addEventListener('input', (e) => this.searchTracks(e.target.value));

                // Filtros
                document.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => this.filterTracks(e.target.dataset.filter));
                });

                // Teclas de acceso rápido
                document.addEventListener('keydown', (e) => this.handleKeyboard(e));
            }

            async loadMusicLibrary() {
                try {
                    // Cargar biblioteca real desde el servidor
                    const response = await fetch('/api/library');
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                    
                    const libraryData = await response.json();
                    
                    // Mapear datos del servidor al formato del reproductor
                    this.tracks = libraryData.tracks.map(track => ({
                        title: track.title,
                        artist: track.artist,
                        duration: track.duration,
                        format: track.format,
                        type: track.category,
                        path: track.path,
                        streamUrl: track.stream_url,
                        sizeMb: track.size_mb
                    }));
                    
                    this.filteredTracks = [...this.tracks];
                    this.renderTrackList();
                    this.updateStats();
                    
                    // Mostrar estadísticas de la biblioteca
                    console.log(`🎵 Biblioteca cargada: ${libraryData.total_tracks} tracks, ${libraryData.total_size_mb} MB`);
                    
                } catch (error) {
                    console.error('Error cargando biblioteca:', error);
                    // Fallback a datos simulados si hay error
                    await this.loadFallbackData();
                }
            }

            async loadFallbackData() {
                console.log('🔄 Usando datos de fallback...');
                const mockTracks = [
                    {
                        title: "🎵 Rosie Dub",
                        artist: "BlackMamba ft. Rosie",
                        duration: "3:24",
                        format: "mp3",
                        type: "collaboration",
                        path: "🎶 _Rosie Dub_ – BlackMamba ft. Rosie.mp3",
                        streamUrl: "/api/stream/🎶 _Rosie Dub_ – BlackMamba ft. Rosie.mp3"
                    },
                    {
                        title: "Ahmed Qalbi",
                        artist: "BlackMamba",
                        duration: "2:36",
                        format: "mp3",
                        type: "original",
                        path: "Ahmed Qalbi.mp3",
                        streamUrl: "/api/stream/Ahmed Qalbi.mp3"
                    },
                    {
                        title: "Chīchīltikpa Yōllōtl",
                        artist: "BlackMamba",
                        duration: "4:12",
                        format: "wav",
                        type: "cultural",
                        path: "Música Suno/Chīchīltikpa Yōllōtl _3 (Remix).wav",
                        streamUrl: "/api/stream/Música Suno/Chīchīltikpa Yōllōtl _3 (Remix).wav"
                    }
                ];

                this.tracks = mockTracks;
                this.filteredTracks = [...this.tracks];
                this.renderTrackList();
                this.updateStats();
            }

            renderTrackList() {
                const html = this.filteredTracks.map((track, index) => `
                    <div class="track-item" data-index="${index}">
                        <div class="track-info">
                            <div class="track-title">${track.title}</div>
                            <div class="track-details">
                                ${track.artist} • ${track.format.toUpperCase()} • ${track.type}
                            </div>
                        </div>
                        <div class="track-duration">${track.duration}</div>
                    </div>
                `).join('');

                this.musicList.innerHTML = html;

                // Agregar event listeners a los tracks
                document.querySelectorAll('.track-item').forEach(item => {
                    item.addEventListener('click', () => {
                        const index = parseInt(item.dataset.index);
                        this.playTrack(index);
                    });
                });
            }

            playTrack(index) {
                if (index >= 0 && index < this.filteredTracks.length) {
                    this.currentIndex = index;
                    this.currentTrack = this.filteredTracks[index];
                    
                    // Actualizar UI
                    this.updateNowPlaying();
                    this.updateTrackSelection();
                    
                    // Cargar archivo de audio real
                    if (this.currentTrack.streamUrl) {
                        this.audioPlayer.src = this.currentTrack.streamUrl;
                        this.audioPlayer.load();
                        
                        // Reproducir automáticamente
                        this.audioPlayer.play()
                            .then(() => {
                                this.isPlaying = true;
                                this.playPauseBtn.innerHTML = '⏸️';
                                this.updateStats();
                            })
                            .catch(error => {
                                console.error('Error reproduciendo:', error);
                                this.showError(`Error reproduciendo: ${this.currentTrack.title}`);
                            });
                    } else {
                        // Fallback a simulación
                        this.simulatePlay();
                    }
                }
            }

            simulatePlay() {
                this.isPlaying = true;
                this.playPauseBtn.innerHTML = '⏸️';
                this.updateStats();
            }

            togglePlayPause() {
                if (this.isPlaying) {
                    this.pause();
                } else {
                    this.play();
                }
            }

            play() {
                if (this.currentTrack) {
                    this.audioPlayer.play()
                        .then(() => {
                            this.isPlaying = true;
                            this.playPauseBtn.innerHTML = '⏸️';
                        })
                        .catch(error => {
                            console.error('Error en play:', error);
                            // Fallback a simulación si hay error
                            this.simulatePlay();
                        });
                }
            }

            pause() {
                this.audioPlayer.pause();
                this.isPlaying = false;
                this.playPauseBtn.innerHTML = '▶️';
            }

            nextTrack() {
                let nextIndex = this.currentIndex + 1;
                if (nextIndex >= this.filteredTracks.length) {
                    nextIndex = 0;
                }
                this.playTrack(nextIndex);
            }

            previousTrack() {
                let prevIndex = this.currentIndex - 1;
                if (prevIndex < 0) {
                    prevIndex = this.filteredTracks.length - 1;
                }
                this.playTrack(prevIndex);
            }

            updateNowPlaying() {
                if (this.currentTrack) {
                    this.currentTitle.textContent = this.currentTrack.title;
                    this.currentArtist.textContent = this.currentTrack.artist;
                    
                    // Cambiar icono según tipo
                    const icons = {
                        'original': '✨',
                        'remix': '🔄', 
                        'cover': '🎤',
                        'collaboration': '🤝',
                        'experimental': '🔬',
                        'cultural': '🏛️'
                    };
                    
                    this.albumArt.textContent = icons[this.currentTrack.type] || '🎵';
                }
            }

            updateTrackSelection() {
                document.querySelectorAll('.track-item').forEach(item => {
                    item.classList.remove('playing');
                });
                
                const currentItem = document.querySelector(`[data-index="${this.currentIndex}"]`);
                if (currentItem) {
                    currentItem.classList.add('playing');
                }
            }

            searchTracks(query) {
                if (!query.trim()) {
                    this.filteredTracks = [...this.tracks];
                } else {
                    this.filteredTracks = this.tracks.filter(track => 
                        track.title.toLowerCase().includes(query.toLowerCase()) ||
                        track.artist.toLowerCase().includes(query.toLowerCase()) ||
                        track.type.toLowerCase().includes(query.toLowerCase())
                    );
                }
                this.renderTrackList();
                this.updateStats();
            }

            filterTracks(filter) {
                // Actualizar botones activos
                document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                document.querySelector(`[data-filter="${filter}"]`).classList.add('active');

                if (filter === 'all') {
                    this.filteredTracks = [...this.tracks];
                } else if (filter === 'mp3' || filter === 'wav') {
                    this.filteredTracks = this.tracks.filter(track => track.format === filter);
                } else {
                    this.filteredTracks = this.tracks.filter(track => 
                        track.type.includes(filter) || track.title.toLowerCase().includes(filter)
                    );
                }
                
                this.renderTrackList();
                this.updateStats();
            }

            changeVolume(value) {
                this.audioPlayer.volume = value / 100;
                this.volumeValue.textContent = `${value}%`;
            }

            updateStats() {
                document.getElementById('trackCount').textContent = this.filteredTracks.length;
                document.getElementById('playingCount').textContent = this.isPlaying ? 1 : 0;
                
                // Calcular tiempo total (simulado)
                const totalSeconds = this.filteredTracks.length * 210; // Promedio 3:30 por track
                const hours = Math.floor(totalSeconds / 3600);
                const minutes = Math.floor((totalSeconds % 3600) / 60);
                document.getElementById('totalDuration').textContent = `${hours}:${minutes.toString().padStart(2, '0')}`;
            }

            handleKeyboard(e) {
                switch(e.code) {
                    case 'Space':
                        e.preventDefault();
                        this.togglePlayPause();
                        break;
                    case 'ArrowLeft':
                        this.previousTrack();
                        break;
                    case 'ArrowRight':
                        this.nextTrack();
                        break;
                }
            }

            showError(message) {
                this.musicList.innerHTML = `<div class="error">❌ ${message}</div>`;
            }
        }

        // Inicializar player cuando el DOM esté listo
        document.addEventListener('DOMContentLoaded', () => {
            window.musicPlayer = new BlackMambaMusicPlayer();
        });
    </script>
</body>
</html>
