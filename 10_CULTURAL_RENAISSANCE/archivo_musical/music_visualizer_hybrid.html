<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵🌈 BLACKMAMBA MUSIC VISUALIZER</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
            overflow: hidden;
        }

        .main-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
        }

        /* Canvas de visualización como fondo */
        #visualizer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.8;
        }

        /* Interfaz del reproductor encima */
        .player-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: grid;
            grid-template-areas: 
                "header header header"
                "library player controls"
                "footer footer footer";
            grid-template-rows: auto 1fr auto;
            grid-template-columns: 1fr 400px 300px;
            gap: 20px;
            padding: 20px;
            background: linear-gradient(135deg, rgba(0,0,0,0.3), rgba(0,0,0,0.7));
            backdrop-filter: blur(5px);
        }

        .header {
            grid-area: header;
            text-align: center;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            border-radius: 15px;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(45deg, #ff0066, #ffaa00, #00ff66, #0066ff, #6600ff, #ff0066);
            background-size: 600% 600%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbow-text 3s ease-in-out infinite;
        }

        @keyframes rainbow-text {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .library-section {
            grid-area: library;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(15px);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow-y: auto;
        }

        .player-section {
            grid-area: player;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .visualizer-controls {
            grid-area: controls;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(15px);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .search-bar {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            color: white;
            font-size: 14px;
            margin-bottom: 15px;
            outline: none;
        }

        .search-bar::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .track-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .track-item {
            display: flex;
            align-items: center;
            padding: 10px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .track-item:hover {
            background: rgba(139, 92, 246, 0.3);
            transform: translateX(5px);
        }

        .track-item.playing {
            background: linear-gradient(90deg, rgba(139, 92, 246, 0.4), rgba(16, 185, 129, 0.4));
            border: 1px solid #8B5CF6;
        }

        .track-info {
            flex: 1;
        }

        .track-title {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 3px;
        }

        .track-details {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
        }

        .track-duration {
            color: #10B981;
            font-weight: 500;
            font-size: 12px;
        }

        .now-playing {
            text-align: center;
            margin-bottom: 20px;
        }

        .album-art {
            width: 150px;
            height: 150px;
            background: linear-gradient(45deg, #8B5CF6, #10B981);
            border-radius: 15px;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            animation: pulse-art 2s ease-in-out infinite;
        }

        @keyframes pulse-art {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .track-title-player {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .track-artist-player {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin: 15px 0;
        }

        .control-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .control-btn:hover {
            background: #8B5CF6;
            transform: scale(1.1);
        }

        .play-pause-btn {
            width: 50px;
            height: 50px;
            background: linear-gradient(45deg, #8B5CF6, #10B981);
        }

        .progress-container {
            margin: 15px 0;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            cursor: pointer;
            margin: 8px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #8B5CF6, #10B981);
            border-radius: 2px;
            width: 0%;
            transition: width 0.1s ease;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
        }

        .visualizer-control-btn {
            padding: 8px 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            color: white;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 12px;
            text-align: center;
        }

        .visualizer-control-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        .visualizer-control-btn.active {
            background: linear-gradient(45deg, #ff0066, #00ff66);
            border-color: transparent;
        }

        .volume-meter {
            width: 100%;
            height: 80px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }

        .volume-fill {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: linear-gradient(to top, #ff0066, #ffaa00, #00ff66, #0066ff);
            transition: height 0.1s ease;
            border-radius: 8px;
        }

        .footer {
            grid-area: footer;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 10px 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: rgba(255, 255, 255, 0.6);
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top: 3px solid #8B5CF6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .player-overlay {
                grid-template-areas: 
                    "header header"
                    "library player"
                    "controls controls"
                    "footer footer";
                grid-template-rows: auto 1fr auto auto;
                grid-template-columns: 1fr 400px;
            }
        }

        @media (max-width: 768px) {
            .player-overlay {
                grid-template-areas: 
                    "header"
                    "player"
                    "controls"
                    "library"
                    "footer";
                grid-template-rows: auto auto auto 1fr auto;
                grid-template-columns: 1fr;
                gap: 10px;
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Canvas de visualización como fondo -->
        <canvas id="visualizer"></canvas>

        <!-- Interfaz del reproductor encima -->
        <div class="player-overlay">
            <div class="header">
                <h1>🎵🌈 BLACKMAMBA MUSIC VISUALIZER</h1>
                <p>Reproductor + Visualizador Rainbow | Studio Mac</p>
            </div>

            <div class="library-section">
                <input type="text" class="search-bar" placeholder="🔍 Buscar música..." id="searchInput">
                <div id="trackList" class="track-list">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Cargando biblioteca...</p>
                    </div>
                </div>
            </div>

            <div class="player-section">
                <div class="now-playing">
                    <div class="album-art" id="albumArt">🎵</div>
                    <div class="track-title-player" id="currentTitle">Selecciona una canción</div>
                    <div class="track-artist-player" id="currentArtist">BlackMamba Records</div>
                </div>

                <div class="progress-container">
                    <div class="progress-bar" id="progressBar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="time-display">
                        <span id="currentTime">0:00</span>
                        <span id="totalTime">0:00</span>
                    </div>
                </div>

                <div class="controls">
                    <button class="control-btn" id="prevBtn">⏮</button>
                    <button class="control-btn play-pause-btn" id="playPauseBtn">▶️</button>
                    <button class="control-btn" id="nextBtn">⏭</button>
                    <button class="control-btn" id="shuffleBtn">🔀</button>
                </div>
            </div>

            <div class="visualizer-controls">
                <h3>🌈 Visualizador</h3>
                <button class="visualizer-control-btn" id="visualizerToggle">🎨 Activar Visualizador</button>
                <button class="visualizer-control-btn" id="modeBtn">🌊 Modo: Ondas</button>
                <button class="visualizer-control-btn" id="speedBtn">⚡ Velocidad: Normal</button>
                
                <div class="volume-meter">
                    <div class="volume-fill" id="volumeFill"></div>
                </div>
                
                <div style="font-size: 11px; color: rgba(255,255,255,0.6); text-align: center; margin-top: 10px;">
                    📊 Medidor de Volumen
                </div>
            </div>

            <div class="footer">
                <div id="statusText">🎵 Reproductor + Visualizador listo | Biblioteca: <span id="trackCount">0</span> canciones</div>
            </div>
        </div>
    </div>

    <audio id="audioPlayer" preload="metadata" crossorigin="anonymous"></audio>

    <script>
        class BlackMambaMusicVisualizer {
            constructor() {
                // Audio y reproductor
                this.tracks = [];
                this.filteredTracks = [];
                this.currentTrack = null;
                this.currentIndex = 0;
                this.isPlaying = false;
                this.audioPlayer = document.getElementById('audioPlayer');
                
                // Visualización
                this.canvas = document.getElementById('visualizer');
                this.ctx = this.canvas.getContext('2d');
                this.audioContext = null;
                this.analyser = null;
                this.dataArray = null;
                this.bufferLength = null;
                this.isVisualizerActive = false;
                this.visualizerSource = null;
                
                // Configuración visual
                this.mode = 'waves';
                this.speed = 1;
                this.colorOffset = 0;
                this.waveOffset = 0;
                
                this.setupRainbowColors();
                this.initializeCanvas();
                this.setupEventListeners();
                this.loadMusicLibrary();
            }

            setupRainbowColors() {
                this.rainbowColors = [
                    '#ff0066', '#ff3366', '#ff6666', '#ff9966', '#ffcc66',
                    '#ffff66', '#ccff66', '#99ff66', '#66ff66', '#66ff99',
                    '#66ffcc', '#66ffff', '#66ccff', '#6699ff', '#6666ff',
                    '#9966ff', '#cc66ff', '#ff66ff', '#ff66cc', '#ff6699'
                ];
            }

            initializeCanvas() {
                const resizeCanvas = () => {
                    this.canvas.width = window.innerWidth;
                    this.canvas.height = window.innerHeight;
                };
                
                resizeCanvas();
                window.addEventListener('resize', resizeCanvas);
            }

            setupEventListeners() {
                // Controles del reproductor
                document.getElementById('playPauseBtn').addEventListener('click', () => this.togglePlayPause());
                document.getElementById('prevBtn').addEventListener('click', () => this.previousTrack());
                document.getElementById('nextBtn').addEventListener('click', () => this.nextTrack());
                document.getElementById('shuffleBtn').addEventListener('click', () => this.toggleShuffle());
                
                // Controles del visualizador
                document.getElementById('visualizerToggle').addEventListener('click', () => this.toggleVisualizer());
                document.getElementById('modeBtn').addEventListener('click', () => this.cycleMode());
                document.getElementById('speedBtn').addEventListener('click', () => this.cycleSpeed());
                
                // Búsqueda
                document.getElementById('searchInput').addEventListener('input', (e) => this.searchTracks(e.target.value));
                
                // Audio player events
                this.audioPlayer.addEventListener('timeupdate', () => this.updateProgress());
                this.audioPlayer.addEventListener('loadedmetadata', () => this.updateDuration());
                this.audioPlayer.addEventListener('ended', () => this.nextTrack());
            }

            async loadMusicLibrary() {
                try {
                    const response = await fetch('/api/library');
                    if (!response.ok) throw new Error('Error cargando biblioteca');
                    
                    const libraryData = await response.json();
                    
                    this.tracks = libraryData.tracks.map(track => ({
                        title: track.title,
                        artist: track.artist,
                        duration: track.duration,
                        format: track.format,
                        type: track.category,
                        path: track.path,
                        streamUrl: track.stream_url
                    }));
                    
                    this.filteredTracks = [...this.tracks];
                    this.renderTrackList();
                    this.updateStats();
                    
                } catch (error) {
                    console.error('Error cargando biblioteca:', error);
                    this.loadFallbackData();
                }
            }

            loadFallbackData() {
                // Datos de ejemplo si no hay servidor
                this.tracks = [
                    {
                        title: "🎵 Demo Track 1",
                        artist: "BlackMamba",
                        duration: "3:24",
                        format: "mp3",
                        type: "original"
                    },
                    {
                        title: "🌈 Rainbow Vibes",
                        artist: "BlackMamba",
                        duration: "2:56",
                        format: "wav",
                        type: "remix"
                    }
                ];
                
                this.filteredTracks = [...this.tracks];
                this.renderTrackList();
                this.updateStats();
            }

            renderTrackList() {
                const html = this.filteredTracks.map((track, index) => `
                    <div class="track-item" data-index="${index}">
                        <div class="track-info">
                            <div class="track-title">${track.title}</div>
                            <div class="track-details">
                                ${track.artist} • ${track.format.toUpperCase()} • ${track.type}
                            </div>
                        </div>
                        <div class="track-duration">${track.duration}</div>
                    </div>
                `).join('');

                document.getElementById('trackList').innerHTML = html;

                // Agregar event listeners
                document.querySelectorAll('.track-item').forEach(item => {
                    item.addEventListener('click', () => {
                        const index = parseInt(item.dataset.index);
                        this.playTrack(index);
                    });
                });
            }

            playTrack(index) {
                if (index >= 0 && index < this.filteredTracks.length) {
                    this.currentIndex = index;
                    this.currentTrack = this.filteredTracks[index];
                    
                    this.updateNowPlaying();
                    this.updateTrackSelection();
                    
                    if (this.currentTrack.streamUrl) {
                        this.audioPlayer.src = this.currentTrack.streamUrl;
                        this.audioPlayer.load();
                        
                        this.audioPlayer.play()
                            .then(() => {
                                this.isPlaying = true;
                                document.getElementById('playPauseBtn').innerHTML = '⏸️';
                                this.setupAudioAnalysis();
                            })
                            .catch(error => console.error('Error reproduciendo:', error));
                    }
                }
            }

            async setupAudioAnalysis() {
                if (!this.audioContext) {
                    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }

                if (!this.visualizerSource) {
                    this.visualizerSource = this.audioContext.createMediaElementSource(this.audioPlayer);
                    this.analyser = this.audioContext.createAnalyser();
                    
                    this.analyser.fftSize = 1024;
                    this.analyser.smoothingTimeConstant = 0.3;
                    this.bufferLength = this.analyser.frequencyBinCount;
                    this.dataArray = new Uint8Array(this.bufferLength);
                    
                    this.visualizerSource.connect(this.analyser);
                    this.visualizerSource.connect(this.audioContext.destination);
                }

                if (this.isVisualizerActive) {
                    this.animate();
                }
            }

            toggleVisualizer() {
                const btn = document.getElementById('visualizerToggle');
                
                if (this.isVisualizerActive) {
                    this.isVisualizerActive = false;
                    btn.textContent = '🎨 Activar Visualizador';
                    btn.classList.remove('active');
                    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                } else {
                    this.isVisualizerActive = true;
                    btn.textContent = '🎨 Desactivar Visualizador';
                    btn.classList.add('active');
                    if (this.analyser) {
                        this.animate();
                    }
                }
            }

            cycleMode() {
                const modes = ['waves', 'bars', 'circle', 'spiral'];
                const currentIndex = modes.indexOf(this.mode);
                this.mode = modes[(currentIndex + 1) % modes.length];
                document.getElementById('modeBtn').textContent = `🌊 Modo: ${this.mode.charAt(0).toUpperCase() + this.mode.slice(1)}`;
            }

            cycleSpeed() {
                const speeds = [0.5, 1, 2, 3];
                const speedNames = ['Lento', 'Normal', 'Rápido', 'Turbo'];
                const currentIndex = speeds.indexOf(this.speed);
                const nextIndex = (currentIndex + 1) % speeds.length;
                this.speed = speeds[nextIndex];
                document.getElementById('speedBtn').textContent = `⚡ Velocidad: ${speedNames[nextIndex]}`;
            }

            animate() {
                if (!this.isVisualizerActive || !this.analyser) return;
                
                requestAnimationFrame(() => this.animate());
                
                this.analyser.getByteFrequencyData(this.dataArray);
                
                this.colorOffset += 0.02 * this.speed;
                this.waveOffset += 0.05 * this.speed;
                
                // Limpiar canvas con fade effect
                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                
                // Calcular volumen promedio
                const averageVolume = this.dataArray.reduce((a, b) => a + b) / this.dataArray.length;
                this.updateVolumeMeter(averageVolume);
                
                // Renderizar según el modo
                switch (this.mode) {
                    case 'waves':
                        this.drawWaves();
                        break;
                    case 'bars':
                        this.drawBars();
                        break;
                    case 'circle':
                        this.drawCircle();
                        break;
                    case 'spiral':
                        this.drawSpiral();
                        break;
                }
            }

            drawWaves() {
                const centerY = this.canvas.height / 2;
                const amplitude = 200;
                const frequency = 0.02;
                
                for (let wave = 0; wave < 3; wave++) {
                    this.ctx.beginPath();
                    this.ctx.lineWidth = 3;
                    
                    const gradient = this.ctx.createLinearGradient(0, 0, this.canvas.width, 0);
                    for (let i = 0; i < this.rainbowColors.length; i++) {
                        gradient.addColorStop(i / (this.rainbowColors.length - 1), this.rainbowColors[i]);
                    }
                    this.ctx.strokeStyle = gradient;
                    
                    for (let x = 0; x < this.canvas.width; x++) {
                        const dataIndex = Math.floor((x / this.canvas.width) * this.bufferLength);
                        const audioValue = this.dataArray[dataIndex] || 0;
                        
                        const y = centerY + 
                                 Math.sin(x * frequency + this.waveOffset + wave) * (audioValue / 255) * amplitude +
                                 Math.sin(x * frequency * 2 + this.waveOffset * 2) * 20;
                        
                        if (x === 0) {
                            this.ctx.moveTo(x, y);
                        } else {
                            this.ctx.lineTo(x, y);
                        }
                    }
                    
                    this.ctx.stroke();
                }
            }

            drawBars() {
                const barWidth = this.canvas.width / this.bufferLength * 2;
                
                for (let i = 0; i < this.bufferLength; i++) {
                    const barHeight = (this.dataArray[i] / 255) * this.canvas.height * 0.8;
                    const x = i * barWidth;
                    const y = this.canvas.height - barHeight;
                    
                    const colorIndex = (i + this.colorOffset * 10) % this.rainbowColors.length;
                    this.ctx.fillStyle = this.rainbowColors[Math.floor(colorIndex)];
                    this.ctx.fillRect(x, y, barWidth - 1, barHeight);
                }
            }

            drawCircle() {
                const centerX = this.canvas.width / 2;
                const centerY = this.canvas.height / 2;
                const baseRadius = 100;
                
                for (let i = 0; i < this.bufferLength; i++) {
                    const angle = (i / this.bufferLength) * Math.PI * 2;
                    const amplitude = (this.dataArray[i] / 255) * 150;
                    const radius = baseRadius + amplitude;
                    
                    const x = centerX + Math.cos(angle) * radius;
                    const y = centerY + Math.sin(angle) * radius;
                    
                    const colorIndex = (i + this.colorOffset * 20) % this.rainbowColors.length;
                    this.ctx.fillStyle = this.rainbowColors[Math.floor(colorIndex)];
                    
                    this.ctx.beginPath();
                    this.ctx.arc(x, y, 3, 0, Math.PI * 2);
                    this.ctx.fill();
                }
            }

            drawSpiral() {
                const centerX = this.canvas.width / 2;
                const centerY = this.canvas.height / 2;
                
                for (let i = 0; i < this.bufferLength; i++) {
                    const angle = (i / this.bufferLength) * Math.PI * 6 + this.waveOffset;
                    const amplitude = (this.dataArray[i] / 255) * 100;
                    const radius = (i / this.bufferLength) * 150 + amplitude;
                    
                    const x = centerX + Math.cos(angle) * radius;
                    const y = centerY + Math.sin(angle) * radius;
                    
                    const colorIndex = (i + this.colorOffset * 15) % this.rainbowColors.length;
                    this.ctx.fillStyle = this.rainbowColors[Math.floor(colorIndex)];
                    
                    this.ctx.beginPath();
                    this.ctx.arc(x, y, 2, 0, Math.PI * 2);
                    this.ctx.fill();
                }
            }

            updateVolumeMeter(volume) {
                const percentage = (volume / 255) * 100;
                document.getElementById('volumeFill').style.height = `${percentage}%`;
            }

            togglePlayPause() {
                if (this.isPlaying) {
                    this.audioPlayer.pause();
                    this.isPlaying = false;
                    document.getElementById('playPauseBtn').innerHTML = '▶️';
                } else if (this.currentTrack) {
                    this.audioPlayer.play();
                    this.isPlaying = true;
                    document.getElementById('playPauseBtn').innerHTML = '⏸️';
                }
            }

            previousTrack() {
                let prevIndex = this.currentIndex - 1;
                if (prevIndex < 0) prevIndex = this.filteredTracks.length - 1;
                this.playTrack(prevIndex);
            }

            nextTrack() {
                let nextIndex = this.currentIndex + 1;
                if (nextIndex >= this.filteredTracks.length) nextIndex = 0;
                this.playTrack(nextIndex);
            }

            updateNowPlaying() {
                if (this.currentTrack) {
                    document.getElementById('currentTitle').textContent = this.currentTrack.title;
                    document.getElementById('currentArtist').textContent = this.currentTrack.artist;
                    
                    const icons = {
                        'original': '✨', 'remix': '🔄', 'cover': '🎤',
                        'collaboration': '🤝', 'experimental': '🔬', 'cultural': '🏛️'
                    };
                    document.getElementById('albumArt').textContent = icons[this.currentTrack.type] || '🎵';
                }
            }

            updateTrackSelection() {
                document.querySelectorAll('.track-item').forEach(item => item.classList.remove('playing'));
                const currentItem = document.querySelector(`[data-index="${this.currentIndex}"]`);
                if (currentItem) currentItem.classList.add('playing');
            }

            updateProgress() {
                if (this.audioPlayer.duration) {
                    const progress = (this.audioPlayer.currentTime / this.audioPlayer.duration) * 100;
                    document.getElementById('progressFill').style.width = `${progress}%`;
                    
                    document.getElementById('currentTime').textContent = this.formatTime(this.audioPlayer.currentTime);
                    document.getElementById('totalTime').textContent = this.formatTime(this.audioPlayer.duration);
                }
            }

            updateDuration() {
                if (this.audioPlayer.duration) {
                    document.getElementById('totalTime').textContent = this.formatTime(this.audioPlayer.duration);
                }
            }

            searchTracks(query) {
                if (!query.trim()) {
                    this.filteredTracks = [...this.tracks];
                } else {
                    this.filteredTracks = this.tracks.filter(track => 
                        track.title.toLowerCase().includes(query.toLowerCase()) ||
                        track.artist.toLowerCase().includes(query.toLowerCase())
                    );
                }
                this.renderTrackList();
                this.updateStats();
            }

            updateStats() {
                document.getElementById('trackCount').textContent = this.filteredTracks.length;
            }

            formatTime(seconds) {
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins}:${secs.toString().padStart(2, '0')}`;
            }
        }

        // Inicializar cuando el DOM esté listo
        document.addEventListener('DOMContentLoaded', () => {
            window.musicVisualizer = new BlackMambaMusicVisualizer();
        });
    </script>
</body>
</html>
